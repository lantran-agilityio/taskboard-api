}
function posOptions(b, c, listId) {
  const l = b.lists.find((x) => x.id === listId);
  const others = active(l.cards).filter((x) => x !== c);
  const same = l.cards.includes(c);
  const cur = same ? active(l.cards).indexOf(c) : others.length;
  return Array.from({ length: others.length + 1 }, (_, i) => `<option value="${i}" ${i === cur ? 'selected' : ''}>${i + 1}${same && i === cur ? ' (current)' : ''}</option>`).join('');
}

/* ---------- render ---------- */
function render() {
  const lanes = document.getElementById('lanes');
  const keep = { lanes: lanes?.scrollLeft || 0, scrim: document.querySelector('.scrim:not(.modal-z):not(.confirm-z)')?.scrollTop || 0, panel: document.querySelector('.panel-body')?.scrollTop || 0, cards: {} };
  document.querySelectorAll('[data-cards]').forEach((el) => { keep.cards[el.dataset.cards] = el.scrollTop; });
  document.body.classList.toggle('show-req', ui.showReq);
  let b = B();
  if (route.view === 'board' && !b) { route = { view: 'home' }; b = null; }
  if (b && route.card != null && !findCard(b, route.card)) route.card = null;
  let html = topbar() + (b ? boardView(b) : home());
  if (b && ui.panel) html += panel(b);
  if (b && route.card != null) html += cardDialog(b);
  if (ui.modal) html += modal(b);
  if (ui.pop) html += `<div class="pop" id="pop" role="dialog" aria-label="Options">${popContent(b)}</div>`;
  if (ui.confirm) html += confirmBox();
  if (ui.toast) html += `<div class="toast" role="status">${esc(ui.toast)}</div>`;
  document.getElementById('app').innerHTML = html;
  document.title = b ? `${b.title} · Taskboard Prototype` : 'Taskboard Prototype';
  const nl = document.getElementById('lanes'); if (nl) nl.scrollLeft = keep.lanes;
  const sc = document.querySelector('.scrim:not(.modal-z):not(.confirm-z)'); if (sc) sc.scrollTop = keep.scrim;
  const pb = document.querySelector('.panel-body'); if (pb) pb.scrollTop = keep.panel;
  document.querySelectorAll('[data-cards]').forEach((el) => { el.scrollTop = keep.cards[el.dataset.cards] || 0; });
  placePop();
  if (ui.confirm) document.getElementById('confirm-yes')?.focus();
  else if (ui.focus) { const el = document.getElementById(ui.focus); if (el) { el.focus(); if (ui.select && el.select) el.select(); } }
  else if (ui.pop && ui.pop !== lastPop) document.querySelector('#pop input:not([type=checkbox]):not([type=radio]), #pop select')?.focus({ preventScroll: true });
  lastPop = ui.pop; ui.focus = null; ui.select = false;
  if (route.comment) {
    const el = document.getElementById('cm-' + route.comment);
    if (el) { el.classList.add('hl'); el.scrollIntoView({ block: 'center' }); }
    route.comment = null;
  }
}
function placePop() {
  const p = document.getElementById('pop');
  if (!p) return;
  const a = ui.pop.anchor && document.getElementById(ui.pop.anchor);
  const w = p.offsetWidth, h = p.offsetHeight;
  let left = (innerWidth - w) / 2, top = 60;
  if (a) {
    const r = a.getBoundingClientRect();
    left = r.left; top = r.bottom + 6;
    if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
  }
  p.style.left = Math.max(8, Math.min(left, innerWidth - w - 8)) + 'px';
  p.style.top = Math.max(8, Math.min(top, innerHeight - h - 8)) + 'px';
}
let lastPop = null;
function openPop(type, anchorId, extra = {}) {
  if (ui.pop && ui.pop.type === type && ui.pop.anchor === anchorId && !extra.mode) { ui.pop = null; return; }
  ui.pop = { type, anchor: anchorId, ...extra };
}

/* ---------- actions on data ---------- */
function moveCard(b, c, toId, index) {
  const from = b.lists.find((l) => l.cards.includes(c)), to = b.lists.find((l) => l.id === toId);
  from.cards.splice(from.cards.indexOf(c), 1);
  const ref = active(to.cards)[index];
  if (ref) to.cards.splice(to.cards.indexOf(ref), 0, c); else to.cards.push(c);
  if (from !== to) {
    logCard(c, `moved this card from ${from.title} to ${to.title}`);
    logBoard(b, `moved “${c.title}” from ${from.title} to ${to.title}`, { card: c.num });
  }
}
function moveList(b, id, index) {
  const l = b.lists.find((x) => x.id === id);
  b.lists.splice(b.lists.indexOf(l), 1);
  const ref = active(b.lists)[index];
  if (ref) b.lists.splice(b.lists.indexOf(ref), 0, l); else b.lists.push(l);
}
function setDone(b, c, done) {
  c.done = done;
  logCard(c, done ? 'marked this card as complete' : 'marked this card as not complete');
  logBoard(b, `marked “${c.title}” as ${done ? 'complete' : 'not complete'}`, { card: c.num });
}
function archiveCard(b, c) {
  c.archived = true; c.archivedAt = Date.now();
  logCard(c, 'archived this card');
  logBoard(b, `archived “${c.title}”`, { card: c.num });
  toast(`Archived “${c.title}”`);
}
function newBoard(title) {
  const b = {
    id: uid('b'), title, desc: '', starred: false, closed: false, closedAt: null, cardSeq: 0, nextComment: 1,
    members: [{ u: ME, role: 'admin', creator: true }], labels: DEFAULT_COLORS.map((c) => ({ id: uid('l'), name: '', color: c })),
    lists: [], activity: [{ u: ME, text: 'created this board', at: Date.now() }],
  };
  state.boards.push(b);
  return b;
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) {
    if (ui.pop && !e.target.closest('.pop')) { ui.pop = null; render(); }
    return;
  }
  const act = t.dataset.act;
  if (act === 'scrim-card' || act === 'scrim-modal') {
    if (e.target !== t) { if (ui.pop) { ui.pop = null; render(); } return; }
    if (ui.pop) { ui.pop = null; render(); return; }
    if (act === 'scrim-card') go('board-' + route.b); else { ui.modal = null; render(); }
    return;
  }
  if (!t.closest('.pop') && !['list-menu', 'card-menu', 'pop-labels', 'pop-dates', 'pop-checklist', 'pop-members', 'pop-move', 'item-meta', 'label-edit', 'label-new'].includes(act)) ui.pop = null;
  const b = B();
  const f = b && route.card != null ? findCard(b, route.card) : null;
  const c = f?.card;
  const num = t.dataset.n ? +t.dataset.n : null;
  switch (act) {
    case 'toggle-req': ui.showReq = !ui.showReq; try { localStorage.setItem('taskboard-proto-req', ui.showReq ? '1' : '0'); } catch (err) { /* ignore */ } break;
    case 'star': { const x = byId(t.dataset.b); x.starred = !x.starred; toast(x.starred ? `Starred “${x.title}”` : `Unstarred “${x.title}”`); break; }
    case 'new-board': ui.modal = 'new-board'; ui.focus = 'nb-title'; break;
    case 'open-closed': ui.modal = 'closed'; break;
    case 'close-modal': ui.modal = null; break;
    case 'reopen': { const x = byId(t.dataset.b); x.closed = false; x.closedAt = null; x.activity.push({ u: ME, text: 'reopened this board', at: Date.now() }); ui.modal = null; toast(`Reopened “${x.title}”`); go('board-' + x.id); return; }
    case 'delete-board': {
      const x = byId(t.dataset.b);
      ask(`Delete “${x.title}” for good?`, 'Its lists, cards, comments and history are deleted too. This can’t be undone.', 'Delete board', () => {
        state.boards.splice(state.boards.indexOf(x), 1); ui.recent = ui.recent.filter((id) => id !== x.id); toast(`Deleted “${x.title}”`);
      });
      break;
    }
    case 'edit-board-title': ui.edit = { k: 'board' }; ui.focus = 'edit-input'; ui.select = true; break;
    case 'open-share': ui.modal = 'share'; ui.focus = 'invite-input'; break;
    case 'open-panel': ui.panel = t.dataset.p; ui.aboutEdit = false; break;
    case 'close-panel': ui.panel = null; break;
    case 'close-board':
      ask(`Close “${b.title}”?`, 'The board becomes read-only and leaves your board list. You can reopen it later from Closed boards on the home screen.', 'Close board', () => {
        b.closed = true; b.closedAt = Date.now(); logBoard(b, 'closed this board'); ui.panel = null; ui.addList = false; ui.addCard = null; toast(`Closed “${b.title}”`);
      }, false);
      break;
    case 'about-edit': ui.aboutEdit = true; ui.focus = 'about-input'; break;
    case 'about-cancel': ui.aboutEdit = false; break;
    case 'act-filter': ui.actFilter = t.dataset.f; break;
    case 'arch-tab': ui.archTab = t.dataset.t; break;
    case 'add-list-open': ui.addList = true; ui.focus = 'add-list-input'; break;
    case 'add-list-cancel': ui.addList = false; break;
    case 'edit-list': ui.edit = { k: 'list', id: t.dataset.l }; ui.focus = 'edit-input'; ui.select = true; break;
    case 'list-menu': openPop('list-menu', t.id, { l: t.dataset.l, mode: null }); if (ui.pop) ui.pop.mode = 'menu'; break;
    case 'lm-back': ui.pop.mode = 'menu'; break;
    case 'lm-move': ui.pop.mode = 'move'; break;
    case 'lm-sort': ui.pop.mode = 'sort'; break;
    case 'lm-add-card': ui.addCard = ui.pop.l; ui.focus = 'add-card-input'; ui.pop = null; break;
    case 'lm-archive': {
      const l = b.lists.find((x) => x.id === ui.pop.l); ui.pop = null;
      ask(`Archive “${l.title}”?`, `The list and its ${active(l.cards).length} cards leave the board. You can restore it from Menu › Archived items.`, 'Archive list', () => {
        l.archived = true; l.archivedAt = Date.now(); logBoard(b, `archived the list ${l.title}`); toast(`Archived “${l.title}”`);
      }, false);
      break;
    }
    case 'sort-do': {
      const l = b.lists.find((x) => x.id === ui.pop.l), s = t.dataset.s;
      const cmp = { new: (a, z) => z.created - a.created, old: (a, z) => a.created - z.created, name: (a, z) => a.title.localeCompare(z.title) }[s];
      l.cards = [...active(l.cards).sort(cmp), ...l.cards.filter((x) => x.archived)];
      ui.pop = null; toast(`Sorted “${l.title}”`);
      break;
    }
    case 'add-card-open': ui.addCard = t.dataset.l; ui.focus = 'add-card-input'; break;
    case 'add-card-cancel': ui.addCard = null; break;
    case 'toggle-done': { const x = findCard(b, num).card; setDone(b, x, !x.done); break; }
    case 'quick-archive': archiveCard(b, findCard(b, num).card); break;
    case 'open-card': go(`card-${b.id}-${num}`); return;
    case 'close-card': go('board-' + b.id); return;
    case 'card-menu': openPop('card-menu', t.id); break;
    case 'pop-move': openPop('move', t.id); break;
    case 'cm-move': ui.pop = { type: 'move', anchor: 'dlg-menu' }; break;
    case 'cm-archive': archiveCard(b, c); ui.pop = null; break;
    case 'restore-card': {
      const x = findCard(b, num).card; x.archived = false; x.archivedAt = null; ui.pop = null;
      logCard(x, 'sent this card back to the board'); logBoard(b, `sent “${x.title}” back to the board`, { card: x.num }); toast(`Restored “${x.title}”`);
      break;
    }
    case 'delete-card': {
      const fx = findCard(b, num); ui.pop = null;
      ask(`Delete “${fx.card.title}” for good?`, 'The card, its comments and its history are deleted. This can’t be undone.', 'Delete card', () => {
        fx.list.cards.splice(fx.list.cards.indexOf(fx.card), 1);
        b.activity = b.activity.filter((a) => a.card !== fx.card.num);
        toast(`Deleted “${fx.card.title}”`);
        if (route.card === fx.card.num) go('board-' + b.id);
      });
      break;
    }
    case 'restore-list': { const l = b.lists.find((x) => x.id === t.dataset.l); l.archived = false; l.archivedAt = null; logBoard(b, `restored the list ${l.title}`); toast(`Restored “${l.title}” to its place`); break; }
    case 'delete-list': {
      const l = b.lists.find((x) => x.id === t.dataset.l);
      ask(`Delete “${l.title}” for good?`, `The list and its ${l.cards.length} cards are deleted. This can’t be undone.`, 'Delete list', () => {
        b.lists.splice(b.lists.indexOf(l), 1); const nums = l.cards.map((x) => x.num); b.activity = b.activity.filter((a) => !nums.includes(a.card));
        logBoard(b, `deleted the list ${l.title}`); toast(`Deleted “${l.title}”`);
      });
      break;
    }
    case 'edit-card-title': ui.edit = { k: 'card' }; ui.focus = 'edit-input'; ui.select = true; break;
    case 'desc-edit': ui.descEdit = true; ui.focus = 'desc-input'; break;
    case 'desc-cancel': ui.descEdit = false; break;
    case 'fmt': fmt(t.dataset.t, t.dataset.f); return;
    case 'pop-labels': openPop('labels', t.id); break;
    case 'pop-dates': openPop('dates', t.id); break;
    case 'pop-checklist': openPop('checklist', t.id); ui.focus = 'cl-title'; ui.select = true; break;
    case 'pop-members': openPop('members', t.id); break;
    case 'label-toggle': {
      const id = t.dataset.id, on = c.labels.includes(id);
      c.labels = on ? c.labels.filter((x) => x !== id) : [...c.labels, id];
      break;
    }
    case 'label-new': ui.pop = { type: 'label-edit', id: null, anchor: ui.pop?.type === 'labels' ? ui.pop.anchor : t.id, back: ui.pop?.type === 'labels' ? ui.pop.anchor : null, fromCard: ui.pop?.type === 'labels' }; ui.focus = 'lbl-name'; break;
    case 'label-edit': ui.pop = { type: 'label-edit', id: t.dataset.id, anchor: ui.pop?.type === 'labels' ? ui.pop.anchor : t.id, back: ui.pop?.type === 'labels' ? ui.pop.anchor : null }; break;
    case 'label-back': ui.pop = { type: 'labels', anchor: ui.pop.back }; break;
    case 'label-delete': {
      const l = b.lists && b.labels.find((x) => x.id === t.dataset.id), back = ui.pop.back; ui.pop = null;
      const used = b.lists.flatMap((x) => x.cards).filter((x) => x.labels.includes(l.id)).length;
      ask('Delete this label?', `It's removed from all ${used} cards that have it. This can't be undone.`, 'Delete label', () => {
        b.labels = b.labels.filter((x) => x !== l); b.lists.forEach((x) => x.cards.forEach((y) => { y.labels = y.labels.filter((id) => id !== l.id); }));
        toast('Label deleted'); if (back) ui.pop = { type: 'labels', anchor: back };
      });
      break;
    }
    case 'dates-remove': c.due = null; c.start = null; logCard(c, 'removed the due date'); ui.pop = null; break;
    case 'member-toggle': {
      const u = t.dataset.u, on = c.members.includes(u);
      c.members = on ? c.members.filter((x) => x !== u) : [...c.members, u];
      const name = users[u].name;
      logCard(c, u === ME ? (on ? 'left this card' : 'joined this card') : (on ? `removed ${name} from this card` : `added ${name} to this card`));
      break;
    }
    case 'item-toggle': {
      const k = c.checklists.find((x) => x.id === t.dataset.k), it = k.items.find((x) => x.id === t.dataset.i);
      it.done = !it.done; logCard(c, it.done ? `completed ${it.t} on this card` : `marked ${it.t} not complete on this card`);
      break;
    }
    case 'hide-checked': { const k = c.checklists.find((x) => x.id === t.dataset.k); k.hideChecked = !k.hideChecked; break; }
    case 'del-checklist': {
      const k = c.checklists.find((x) => x.id === t.dataset.k);
      ask(`Delete the checklist “${k.title}”?`, `Its ${k.items.length} items are deleted too.`, 'Delete checklist', () => { c.checklists = c.checklists.filter((x) => x !== k); logCard(c, `removed ${k.title} from this card`); });
      break;
    }
    case 'add-item-open': ui.addItem = t.dataset.k; ui.focus = 'add-item-input'; break;
    case 'add-item-cancel': ui.addItem = null; break;
    case 'item-meta': openPop('item', t.id, { k: t.dataset.k, i: t.dataset.i }); break;
    case 'item-delete': { const k = c.checklists.find((x) => x.id === ui.pop.k); k.items = k.items.filter((x) => x.id !== ui.pop.i); ui.pop = null; break; }
    case 'toggle-details': ui.showDetails = !ui.showDetails; break;
    case 'comment-edit': ui.editComment = +t.dataset.id; ui.focus = 'comment-edit-input'; break;
    case 'comment-cancel': ui.editComment = null; break;
    case 'comment-delete': {
      const id = +t.dataset.id;
      ask('Delete this comment?', 'Deleting a comment is permanent. This can’t be undone.', 'Delete comment', () => { c.comments = c.comments.filter((x) => x.id !== id); toast('Comment deleted'); });
      break;
    }
    case 'comment-link': {
      const url = `${location.href.split('#')[0]}#card-${b.id}-${c.num}-c${t.dataset.id}`;
      const fail = () => toast(`Link: ${url}`);
      try { navigator.clipboard.writeText(url).then(() => toast('Link to the comment copied'), fail); } catch (err) { fail(); }
      return;
    }
    case 'leave-board':
      ask(`Leave “${b.title}”?`, 'You lose access to the board and are removed from its cards.', 'Leave board', () => {
        b.members = b.members.filter((m) => m.u !== ME); b.lists.forEach((l) => l.cards.forEach((x) => { x.members = x.members.filter((u) => u !== ME); }));
        logBoard(b, 'left this board'); ui.modal = null; toast(`You left “${b.title}”`); go('home');
      });
      break;
    case 'confirm-yes': { const fn = confirmFn; ui.confirm = null; confirmFn = null; fn?.(); break; }
    case 'confirm-no': ui.confirm = null; confirmFn = null; break;
    case 'close-pop': ui.pop = null; break;
    default: return;
  }
  render();
});

function fmt(target, kind) {
  const ta = document.getElementById(target);
  if (!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
  const rep = kind === 'b' ? `**${sel || 'bold text'}**` : kind === 'i' ? `_${sel || 'italic text'}_` : (sel || 'item').split('\n').map((x) => `- ${x.replace(/^- /, '')}`).join('\n');
  ta.setRangeText(rep, s, e, 'select');
  ta.focus();
}

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const form = e.target, kind = form.dataset.form, b = B();
  const val = (id) => document.getElementById(id)?.value ?? '';
  const f = b && route.card != null ? findCard(b, route.card) : null;
  const c = f?.card;
  switch (kind) {
    case 'new-board': {
      const title = val('nb-title').trim();
      if (!title) return;
      const nb = newBoard(title); ui.modal = null; ui.openAddList = true;
      go('board-' + nb.id); return;
    }
    case 'board-title': saveBoardTitle(); break;
    case 'list-name': saveListName(); break;
    case 'card-title': saveCardTitle(); break;
    case 'add-list': {
      const name = val('add-list-input').trim();
      if (name) { b.lists.push({ id: uid('L'), title: name, archived: false, archivedAt: null, cards: [] }); logBoard(b, `added the list ${name}`); }
      ui.focus = 'add-list-input';
      requestAnimationFrame(() => { const l = document.getElementById('lanes'); if (l) l.scrollLeft = l.scrollWidth; });
      break;
    }
    case 'add-card': {
      const title = val('add-card-input').trim(), l = b.lists.find((x) => x.id === form.dataset.l);
      if (!title) { ui.addCard = null; break; }
      const nc = makeCard(b, title, l.title); l.cards.push(nc); logBoard(b, `added “${title}” to ${l.title}`, { card: nc.num });
      ui.focus = 'add-card-input';
      requestAnimationFrame(() => { const el = document.querySelector(`[data-cards="${l.id}"]`); if (el) el.scrollTop = el.scrollHeight; });
      break;
    }
    case 'desc': c.desc = val('desc-input').trim(); ui.descEdit = false; logCard(c, 'updated the description'); break;
    case 'about': b.desc = val('about-input').trim(); ui.aboutEdit = false; logBoard(b, 'changed the board description'); break;
    case 'comment': {
      const text = val('comment-input').trim();
      if (!text) { ui.focus = 'comment-input'; break; }
      c.comments.push({ id: b.nextComment++, u: ME, text, at: Date.now() });
      logBoard(b, `commented on “${c.title}”`, { comment: true, card: c.num });
      break;
    }
    case 'comment-edit': {
      const x = c.comments.find((y) => y.id === +form.dataset.id), text = val('comment-edit-input').trim();
      if (text && text !== x.text) { x.text = text; x.edited = true; }
      ui.editComment = null; break;
    }
    case 'move-card': moveCard(b, c, val('mv-list'), +val('mv-pos')); ui.pop = null; toast('Card moved'); break;
    case 'move-list': moveList(b, ui.pop.l, +val('ml-pos')); ui.pop = null; break;
    case 'label': {
      const name = val('lbl-name').trim(), color = form.querySelector('input[name=lbl-color]:checked')?.value || null;
      if (!name && !color) { document.getElementById('lbl-err').hidden = false; return; }
      const p = ui.pop;
      if (p.id) { const l = b.labels.find((x) => x.id === p.id); l.name = name; l.color = color; }
      else { const l = { id: uid('l'), name, color }; b.labels.push(l); if (p.fromCard && c) c.labels.push(l.id); }
      ui.pop = p.back ? { type: 'labels', anchor: p.back } : null;
      break;
    }
    case 'dates': {
      const due = new Date(`${val('due-date')}T${val('due-time') || '12:00'}`).getTime();
      if (Number.isNaN(due)) return;
      const startOn = document.getElementById('start-on').checked;
      const start = startOn ? new Date(`${val('start-date')}T00:00`).getTime() : null;
      if (start && start > due) { document.getElementById('dates-err').hidden = false; return; }
      c.due = due; c.start = start; logCard(c, `set the due date to ${dayWords(due)}`); ui.pop = null;
      break;
    }
    case 'checklist': {
      const title = val('cl-title').trim() || 'Checklist', k = { id: uid('k'), title, hideChecked: false, items: [] };
      c.checklists.push(k); logCard(c, `added ${title} to this card`); ui.pop = null; ui.addItem = k.id; ui.focus = 'add-item-input';
      break;
    }
    case 'add-item': {
      const text = val('add-item-input').trim(), k = c.checklists.find((x) => x.id === form.dataset.k);
      if (text) k.items.push({ id: uid('i'), t: text, done: false, assignee: null, due: null });
      ui.focus = 'add-item-input'; break;
    }
    case 'item-meta': {
      const k = c.checklists.find((x) => x.id === ui.pop.k), it = k.items.find((x) => x.id === ui.pop.i);
      it.assignee = val('im-assignee') || null; const d = val('im-due'); it.due = d ? new Date(`${d}T17:00`).getTime() : null; ui.pop = null;
      break;
    }
    case 'invite': {
      const raw = val('invite-input').trim();
      if (!raw) { document.getElementById('invite-err').hidden = false; return; }
      const name = raw.includes('@') ? raw.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, (m) => m.toUpperCase()) : raw;
      const u = uid('u'); users[u] = { name };
      b.members.push({ u, role: val('invite-role') }); logBoard(b, `added ${name} to this board`); toast(`Invited ${name}`); ui.focus = 'invite-input';
      break;
    }
    default: return;
  }
  render();
});
function saveBoardTitle() {
  const b = B(); if (!b || ui.edit?.k !== 'board') return;
  const v = (document.getElementById('edit-input')?.value || '').trim(); ui.edit = null;
  if (v && v !== b.title) { logBoard(b, `renamed this board (was “${b.title}”)`); b.title = v; }
}
function saveListName() {
  const b = B(); if (!b || ui.edit?.k !== 'list') return;
  const l = b.lists.find((x) => x.id === ui.edit.id), v = (document.getElementById('edit-input')?.value || '').trim(); ui.edit = null;
  if (l && v && v !== l.title) { logBoard(b, `renamed the list ${l.title} to ${v}`); l.title = v; }
}
function saveCardTitle() {
  const b = B(); if (!b || ui.edit?.k !== 'card') return;
  const c = findCard(b, route.card)?.card, v = (document.getElementById('edit-input')?.value || '').trim(); ui.edit = null;
  if (c && v && v !== c.title) { logCard(c, `renamed this card (was “${c.title}”)`); c.title = v; }
}
document.addEventListener('focusout', (e) => {
  if (e.target.id !== 'edit-input' || !ui.edit) return;
  setTimeout(() => {
    if (!ui.edit || document.activeElement?.id === 'edit-input') return;
    ({ board: saveBoardTitle, list: saveListName, card: saveCardTitle })[ui.edit.k]();
    render();
  }, 0);
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.filter) {
    const q = t.value.trim().toLowerCase(), scope = t.closest('.pop, .panel') || document;
    scope.querySelectorAll(t.dataset.filter).forEach((el) => { el.hidden = !!q && !(el.dataset.name || '').includes(q); });
  }
  if (t.id === 'nb-title') {
    const ok = !!t.value.trim();
    document.getElementById('nb-create').disabled = !ok;
    document.getElementById('nb-hint').textContent = ok ? 'Press Enter or Create.' : 'A title is required.';
  }
  if (t.id === 'lbl-name') updateLabelPreview();
  if (t.id === 'invite-input') document.getElementById('invite-err').hidden = true;
});
document.addEventListener('change', (e) => {
  const t = e.target, b = B();
  if (t.name === 'lbl-color') updateLabelPreview();
  if (t.id === 'start-on') document.getElementById('start-date').disabled = !t.checked;
  if (t.id === 'mv-list') { const c = findCard(b, route.card).card; document.getElementById('mv-pos').innerHTML = posOptions(b, c, t.value); }
  if (t.dataset.roleU) {
    const m = b.members.find((x) => x.u === t.dataset.roleU);
    m.role = t.value; logBoard(b, `made ${users[m.u].name} ${t.value === 'admin' ? 'an admin' : 'a member'}`); render();
  }
});
function updateLabelPreview() {
  const name = document.getElementById('lbl-name').value.trim(), color = document.querySelector('input[name=lbl-color]:checked')?.value || null;
  document.getElementById('lbl-preview').innerHTML = chip({ name, color }, 'lg');
  document.getElementById('lbl-err').hidden = true;
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches?.('article.card')) { e.preventDefault(); e.target.click(); return; }
  if (e.key !== 'Escape') return;
  if (ui.confirm) { ui.confirm = null; confirmFn = null; }
  else if (ui.pop) ui.pop = null;
  else if (ui.edit) ui.edit = null;
  else if (ui.editComment) ui.editComment = null;
  else if (ui.descEdit) ui.descEdit = false;
  else if (ui.addItem) ui.addItem = null;
  else if (ui.modal) ui.modal = null;
  else if (route.card != null) { go('board-' + route.b); return; }
  else if (ui.addCard) ui.addCard = null;
  else if (ui.addList) ui.addList = false;
  else if (ui.panel) ui.panel = null;
  else return;
  render();
});

/* drag and drop: cards within and between lists, lists along the board */
function clearMarks() { document.querySelectorAll('.drop-before, .drop-end').forEach((el) => el.classList.remove('drop-before', 'drop-end')); }
document.addEventListener('dragstart', (e) => {
  const card = e.target.closest?.('.card[draggable="true"]'), head = e.target.closest?.('.list-head[draggable="true"]');
  if (card && e.target === card) { ui.drag = { type: 'card', num: +card.dataset.card }; card.classList.add('dragging'); }
  else if (head && e.target === head) {
    const list = head.closest('.list');
    ui.drag = { type: 'list', id: list.dataset.list }; list.classList.add('dragging');
    e.dataTransfer.setDragImage(list, 24, 18);
  } else return;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
});
document.addEventListener('dragover', (e) => {
  if (!ui.drag) return;
  clearMarks();
  if (ui.drag.type === 'card') {
    const col = e.target.closest('.list');
    if (!col) { ui.drop = null; return; }
    e.preventDefault();
    const box = col.querySelector('.cards');
    const cs = [...box.querySelectorAll('.card')].filter((x) => +x.dataset.card !== ui.drag.num);
    const before = cs.find((x) => { const r = x.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
    if (before) before.classList.add('drop-before'); else box.classList.add('drop-end');
    ui.drop = { list: col.dataset.list, index: before ? cs.indexOf(before) : cs.length };
  } else {
    const lanes = e.target.closest('#lanes');
    if (!lanes) { ui.drop = null; return; }
    e.preventDefault();
    const ls = [...lanes.querySelectorAll('.list')].filter((x) => x.dataset.list !== ui.drag.id);
    const before = ls.find((x) => { const r = x.getBoundingClientRect(); return e.clientX < r.left + r.width / 2; });
    if (before) before.classList.add('drop-before'); else lanes.classList.add('drop-end');
    ui.drop = { index: before ? ls.indexOf(before) : ls.length };
  }
});
document.addEventListener('drop', (e) => {
  if (!ui.drag || !ui.drop) return;
  e.preventDefault();
  const b = B();
  if (ui.drag.type === 'card') moveCard(b, findCard(b, ui.drag.num).card, ui.drop.list, ui.drop.index);
  else moveList(b, ui.drag.id, ui.drop.index);
  ui.drag = ui.drop = null;
  render();
});
document.addEventListener('dragend', () => { ui.drag = ui.drop = null; clearMarks(); document.querySelectorAll('.dragging').forEach((x) => x.classList.remove('dragging')); });
window.addEventListener('resize', placePop);

if (route.view === 'board' && byId(route.b)) ui.recent = [route.b, ...ui.recent.filter((x) => x !== route.b)];
render();
</script>
</body>
</html>
